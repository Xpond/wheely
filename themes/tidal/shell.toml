# Unspecified roles inherit the palette in colors.toml.
[bar]
background = "#F2F2EE"
background-alpha = 0.94

[menu]
background = "#F2F2EE"
border = "#8CADAA"
border-alpha = 0.55
scrim = "#EAF2EF"
scrim-alpha = 0.36
selected-background = "#7FBDB4"
selected-background-alpha = 0.20
selected-border = "#146A7C"
selected-border-alpha = 0.30

[popups]
background = "#F2F2EE"
border = "#8CADAA"
border-alpha = 0.55

[tooltip]
background = "#F2F2EE"
border = "#8CADAA"
border-alpha = 0.55

[notifications]
background = "#F2F2EE"
border = "#8CADAA"
border-alpha = 0.55

[lock]
background = "#F2F2EE"
background-alpha = 0.90
placeholder = "#506566"
border = "#8CADAA"

[controls]
normal-border = "#8CADAA"
normal-border-alpha = 0.45
hover-cursor-color = "#146A7C"
hover-cursor-border = "#146A7C"
hover-cursor-border-alpha = 0.35
focus-border = "#146A7C"
focus-border-alpha = 0.55
selected-color = "#146A7C"
